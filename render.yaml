databases:
  - name: scholarship-db
    databaseName: scholarship_system
    user: scholarship_user
    plan: free

services:
  - type: web
    name: scholarship-system
    env: docker
    plan: free
    dockerCommand: "" # Uses CMD from Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        # Render provides this via RENDER_EXTERNAL_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: scholarship-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: scholarship-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: scholarship-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: scholarship-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: scholarship-db
          property: password
